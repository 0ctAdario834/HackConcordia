<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Studious</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <link href="styles.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <fieldset>
                <form class="search-form" role="search">
                    <input type="search" id="search" name="q" placeholder="search places">
                    <button type="submit" id="search-button">Search</button>
                </form>
                <ul class="tags">
                    <li>
                        <input type="checkbox" id="tag1" value="Study">
                        <label for="tag1">Study</label>
                    </li>
                    <li>
                        <input type="checkbox" id="tag2" value="Library">
                        <label for="tag2">Library</label>
                    </li>
                    <li>
                        <input type="checkbox" id="tag3" value="Café">
                        <label for="tag3">Café</label>
                    </li>
                    <li>
                        <input type="checkbox" id="tag4" value="Cafeteria">
                        <label for="tag4">Cafeteria</label>
                    </li>
                </ul>
            </fieldset>
        </header>
        <main>
            <ul class="results" id="results"></ul>
            <template id="place-template">
                <li class="result">
                    <h2></h2>
                    <p></p>
                </li>
            </template>
            <div class="add-place">
                <button type="button" id="add-place">Add new place</button>
            </div>
        </main>

        <dialog id="add-place-dialog">
            <form id="add-place-form" class="place-form">
                <h2>Add a new place</h2>

                <label for="place-name">Name</label>
                <input type="text" id="place-name" name="name" maxlength="100" required>

                <label for="place-description">Description</label>
                <textarea id="place-description" name="description" rows="3" maxlength="500"></textarea>

                <fieldset class="place-tags">
                    <legend>Tags</legend>
                    <div class="tag-options">
                        <label class="tag-option" for="new-tag1">
                            <input type="checkbox" id="new-tag1" name="tags" value="Study">
                            Study
                        </label>
                        <label class="tag-option" for="new-tag2">
                            <input type="checkbox" id="new-tag2" name="tags" value="Library">
                            Library
                        </label>
                        <label class="tag-option" for="new-tag3">
                            <input type="checkbox" id="new-tag3" name="tags" value="Café">
                            Café
                        </label>
                        <label class="tag-option" for="new-tag4">
                            <input type="checkbox" id="new-tag4" name="tags" value="Cafeteria">
                            Cafeteria
                        </label>
                    </div>
                </fieldset>

                <p class="form-error" id="form-error" role="alert"></p>

                <div class="form-actions">
                    <button type="button" id="cancel-place">Cancel</button>
                    <button type="submit" id="save-place">Save</button>
                </div>
            </form>
        </dialog>

        <footer>
            © OpenStreetMap contributors
        </footer>

        <script src="app.js"></script>
    </body>
</html>
