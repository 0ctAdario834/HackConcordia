<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Studious</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <link href="styles.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <fieldset>
                <form class="search-form" role="search">
                    <input type="search" id="search" name="q" placeholder="search places">
                    <button type="submit" id="search-button">Search</button>
                </form>
                <ul class="tags">
                    <li>
                        <input type="checkbox" id="tag1" value="tag1">
                        <label for="tag1">Study</label>
                    </li>
                    <li>
                        <input type="checkbox" id="tag2" value="tag2">
                        <label for="tag2">Library</label>
                    </li>
                    <li>
                        <input type="checkbox" id="tag3" value="tag3">
                        <label for="tag3">Café</label>
                    </li>
                    <li>
                        <input type="checkbox" id="tag4" value="tag4">
                        <label for="tag4">Cafeteria</label>
                    </li>
                </ul>
            </fieldset>
        </header>
        <main>
            <ul class="results">
                <li class="result">
                    <h2>Place name</h2>
                    <p>Short description of the place.</p>
                </li>
                <li class="result">
                    <h2>Place name</h2>
                    <p>Short description of the place.</p>
                </li>
                <li class="result">
                    <h2>Place name</h2>
                    <p>Short description of the place.</p>
                </li>
            </ul>
            <div class="add-place">
                <button type="button" id="add-place">Add new place</button>
            </div>
        </main>
        <footer>
            © OpenStreetMap contributors
        </footer>
    </body>
</html>
